<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmSight</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5f6672; --line: #e2e5ea;
  --accent: #3b5bdb; --accent-ink: #ffffff; --pos: #2b8a3e; --neg: #c92a2a; --mid: #868e96;
  --chip: #eef1f6; --event: #fff4e6; --event-ink: #8a4b00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --panel: #1a1d23; --ink: #e9ecef; --muted: #9aa3ae; --line: #2c3139;
    --accent: #748ffc; --accent-ink: #0b0d10; --pos: #69db7c; --neg: #ff8787; --mid: #adb5bd;
    --chip: #242832; --event: #3a2a12; --event-ink: #ffc078;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header .llm { margin-left: auto; color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 50px); }
main > * { min-width: 0; }
aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); overflow: auto; }
section.work { padding: 16px 20px; overflow: auto; min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
textarea { min-height: 140px; resize: vertical; }
button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }
.row > button { flex: 0 0 auto; }
.plist { list-style: none; padding: 0; margin: 0; }
.plist li { padding: 8px; border-radius: 6px; cursor: pointer; }
.plist li:hover, .plist li.on { background: var(--chip); }
.plist small { display: block; color: var(--muted); }
.status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 12px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); text-transform: uppercase; letter-spacing: .5px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px; min-width: 0; overflow-x: auto; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { flex: 0 0 auto; background: none; color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font-weight: 500; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { display: none; } .pane.on { display: block; }
svg text { fill: var(--ink); font-size: 11px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.bar { position: relative; height: 8px; background: var(--chip); border-radius: 4px; min-width: 120px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.bar b { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.post { padding: 10px 0; border-bottom: 1px solid var(--line); }
.post .meta { color: var(--muted); font-size: 12px; }
.post.reply { margin-left: 24px; }
.post.event { background: var(--event); color: var(--event-ink); padding: 10px; border-radius: 6px; border: 0; margin: 6px 0; }
.report h1 { font-size: 20px; } .report h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 15px; }
.chatlog { min-height: 200px; max-height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.assistant { align-self: flex-start; background: var(--chip); }
.err { color: var(--neg); font-size: 12px; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .controls { grid-template-columns: 1fr; }
  section.work { padding: 16px; }
  header .tag { display: none; }
  .status strong { flex-basis: 100%; }
}
</style>
</head>
<body>
<header><h1>SwarmSight</h1><span class="tag">rehearse the future with a swarm of agents</span><span class="llm" id="llm"></span></header>
<main>
<aside>
  <h2>New simulation</h2>
  <label for="q">What do you want to predict?</label>
  <input id="q" placeholder="Will the council approve the congestion charge?">
  <label for="title">Title (optional)</label>
  <input id="title">
  <label for="seed">Seed material: news, reports, a story…</label>
  <textarea id="seed" placeholder="Paste text here, or load a .txt/.md file below"></textarea>
  <input type="file" id="file" accept=".txt,.md,.markdown,.csv,.json" style="margin-top:6px">
  <div class="row" style="margin-top:8px">
    <div><label for="maxa">Max agents</label><input id="maxa" type="number" value="24" min="2" max="200"></div>
    <button id="create">Build world</button>
  </div>
  <div class="err" id="createErr"></div>
  <h2>Projects</h2>
  <ul class="plist" id="plist"></ul>
</aside>
<section class="work" id="work"><div class="empty">Create a simulation or pick a project.</div></section>
</main>

<template id="tpl">
  <div class="status"><strong id="ptitle"></strong><span class="badge" id="pstatus"></span><span id="pmsg" style="color:var(--muted)"></span></div>
  <div class="controls">
    <div class="card">
      <h2>Run</h2>
      <div class="row"><div><label for="rounds">Rounds</label><input id="rounds" type="number" value="5" min="1" max="100"></div><button id="run">Run rounds</button></div>
    </div>
    <div class="card">
      <h2>God's-eye view: inject an event</h2>
      <div class="row"><div><label for="itext">Event</label><input id="itext" placeholder="The regulator delays the vote by a month"></div>
      <div style="flex:0 0 80px"><label for="iround">Round</label><input id="iround" type="number" min="1"></div><button id="inject" class="ghost">Inject</button></div>
    </div>
  </div>
  <div class="err" id="actErr"></div>
  <div class="tabs" id="tabs">
    <button data-t="stance" class="on">Stance</button><button data-t="graph">Graph</button><button data-t="agents">Agents</button>
    <button data-t="feed">Feed</button><button data-t="report">Report</button><button data-t="chat">Chat</button>
  </div>
  <div class="pane on card" data-p="stance"><div id="chart"></div></div>
  <div class="pane card" data-p="graph"><div id="graph"></div></div>
  <div class="pane card" data-p="agents"><div id="agents"></div></div>
  <div class="pane card" data-p="feed"><div id="feed"></div></div>
  <div class="pane card report" data-p="report"><div id="report"></div></div>
  <div class="pane card" data-p="chat">
    <label for="who">Talk to</label><select id="who"></select>
    <div class="chatlog" id="chatlog" style="margin-top:10px"></div>
    <div class="row"><input id="chatIn" placeholder="Ask a question"><button id="send">Send</button></div>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: {"content-type": "application/json"}, ...opts});
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body?.detail || r.statusText);
  return body;
};
let current = null, data = null, poll = null, chats = {}, layout = {};

async function refreshList() {
  const list = await api("/api/projects");
  $("#plist").innerHTML = list.map(p => `<li data-id="${p.id}" class="${p.id === current ? "on" : ""}">${esc(p.title)}
    <small>${esc(p.status)} · ${p.agents} agents · ${p.rounds} rounds</small></li>`).join("") || `<li class="empty">None yet</li>`;
  $("#plist").querySelectorAll("li[data-id]").forEach(li => li.onclick = () => open(li.dataset.id));
}

$("#file").onchange = async e => { const f = e.target.files[0]; if (f) $("#seed").value = await f.text(); };
$("#create").onclick = async () => {
  $("#createErr").textContent = "";
  try {
    const p = await api("/api/projects", {method: "POST", body: JSON.stringify({
      question: $("#q").value, title: $("#title").value, seed: $("#seed").value, max_agents: +$("#maxa").value})});
    await refreshList(); open(p.id);
  } catch (e) { $("#createErr").textContent = e.message; }
};

async function open(id) {
  current = id; chats = {}; layout = {};
  history.replaceState(null, "", `#${id}`);
  $("#work").innerHTML = ""; $("#work").append($("#tpl").content.cloneNode(true));
  $("#tabs").onclick = e => { const t = e.target.dataset.t; if (!t) return;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.dataset.p === t)); };
  $("#run").onclick = () => act(`/api/projects/${id}/run`, {rounds: +$("#rounds").value});
  $("#inject").onclick = () => act(`/api/projects/${id}/inject`, {text: $("#itext").value, round: +$("#iround").value || null}, () => $("#itext").value = "");
  $("#send").onclick = send; $("#chatIn").onkeydown = e => e.key === "Enter" && send();
  $("#who").onchange = drawChat;
  await load(); refreshList();
}

async function act(path, body, done) {
  $("#actErr").textContent = "";
  try { await api(path, {method: "POST", body: JSON.stringify(body)}); done?.(); await load(); }
  catch (e) { $("#actErr").textContent = e.message; }
}

async function load() {
  if (!current) return;
  const id = current;
  const d = await api(`/api/projects/${id}`);
  if (id !== current) return;
  data = d; render();
  clearTimeout(poll);
  if (d.busy || ["building", "running", "reporting"].includes(d.status)) poll = setTimeout(load, 1200);
  else refreshList();
}

function render() {
  const d = data;
  $("#ptitle").textContent = d.title; $("#pstatus").textContent = d.status; $("#pmsg").textContent = d.message;
  const busy = d.busy || !d.agents.length;
  $("#run").disabled = busy; $("#inject").disabled = busy;
  $("#iround").placeholder = d.rounds + 1;
  drawChart(d); drawGraph(d); drawAgents(d); drawFeed(d); drawReport(d); fillWho(d);
}

const stanceColor = s => s > 0.2 ? "var(--pos)" : s < -0.2 ? "var(--neg)" : "var(--mid)";

function drawChart(d) {
  const st = d.stats; if (!st.length) { $("#chart").innerHTML = `<div class="empty">Building the world…</div>`; return; }
  const W = 760, H = 260, L = 40, R = 44, B = 30, n = Math.max(1, st.length - 1);
  const x = i => L + (W - L - R) * i / n, y = v => 10 + (H - B - 10) * (1 - (v + 1) / 2);
  const ys = v => 10 + (H - B - 10) * (1 - v);
  const line = (f, color, w = 2) => `<polyline fill="none" stroke="${color}" stroke-width="${w}" points="${st.map((s, i) => `${x(i)},${f(s)}`).join(" ")}"/>`;
  const inj = d.injections.map(j => j.round <= st.length - 1 ? `<line x1="${x(j.round)}" x2="${x(j.round)}" y1="10" y2="${H - B}" stroke="var(--event-ink)" stroke-dasharray="4 3"/><text x="${x(j.round) + (x(j.round) > W / 2 ? -4 : 4)}" y="22" text-anchor="${x(j.round) > W / 2 ? "end" : "start"}">⚡ ${esc(j.text.slice(0, 40))}${j.text.length > 40 ? "…" : ""}</text>` : "").join("");
  $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Stance by round">
    ${[-1, 0, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v) + 4}">${v > 0 ? "+" : ""}${v}</text><text x="${W - R + 6}" y="${y(v) + 4}">${(v + 1) * 50}%</text>`).join("")}
    ${st.map((s, i) => `<text x="${x(i) - 4}" y="${H - 10}">${s.round}</text>`).join("")}
    ${inj}
    ${line(s => ys(s.support_share), "var(--pos)", 1.5)}${line(s => ys(s.oppose_share), "var(--neg)", 1.5)}
    ${line(s => y(s.mean_stance), "var(--accent)", 3)}
  </svg>
  <div style="color:var(--muted);font-size:12px"><span style="color:var(--accent)">━</span> mean stance, left axis (−1 against … +1 for)
  &nbsp; <span class="pos">━</span> support share &nbsp; <span class="neg">━</span> oppose share, right axis (0–100%)</div>`;
}

// Force-directed layout (Fruchterman-Reingold) plus a pass that pushes overlapping labels apart.
// Large graphs get a taller canvas and only the best-connected nodes are labelled.
function layoutGraph(g, W) {
  const nodes = g.nodes, n = nodes.length, H = Math.max(460, n * 9);
  const idx = Object.fromEntries(nodes.map((x, i) => [x.id, i]));
  const ranked = [...nodes.keys()].sort((a, b) => nodes[b].degree - nodes[a].degree);
  const labelled = new Set(ranked.slice(0, 30));
  const k = Math.sqrt(W * H / n) * 0.35, cx = W / 2 - 50, cy = H / 2, grav = 0.2;
  const P = nodes.map((x, i) => ({x: cx + 150 * Math.cos(i * 2.4), y: cy + 130 * Math.sin(i * 2.4)}));
  const links = g.links.map(l => [idx[l.source], idx[l.target]]).filter(([a, b]) => a != null && b != null && a !== b);
  const clampX = v => Math.max(20, Math.min(W - 160, v)), clampY = v => Math.max(16, Math.min(H - 16, v));
  for (let it = 0, N = 300; it < N; it++) {
    const t = 30 * (1 - it / N) + 1, D = P.map(() => ({x: 0, y: 0}));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d = Math.max(1, Math.hypot(dx, dy)), f = k * k / d;
      D[i].x += dx / d * f; D[i].y += dy / d * f; D[j].x -= dx / d * f; D[j].y -= dy / d * f; }
    for (const [a, b] of links) {
      const dx = P[a].x - P[b].x, dy = P[a].y - P[b].y, d = Math.max(1, Math.hypot(dx, dy)), f = d * d / k;
      D[a].x -= dx / d * f; D[a].y -= dy / d * f; D[b].x += dx / d * f; D[b].y += dy / d * f; }
    P.forEach((p, i) => {
      const gd = Math.hypot(cx - p.x, cy - p.y);  // gravity keeps unconnected nodes in view
      D[i].x += (cx - p.x) * gd / k * grav; D[i].y += (cy - p.y) * gd / k * grav;
      const len = Math.max(1e-6, Math.hypot(D[i].x, D[i].y)), step = Math.min(len, t);
      p.x = clampX(p.x + D[i].x / len * step); p.y = clampY(p.y + D[i].y / len * step); });
  }
  const box = i => [P[i].x, P[i].y - 9, P[i].x + (labelled.has(i) ? 12 + nodes[i].id.length * 7 : 10), P[i].y + 9];
  for (let it = 0; it < 200; it++) {
    let moved = false;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = box(i), b = box(j);
      if (a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3]) {
        const push = (Math.min(a[3], b[3]) - Math.max(a[1], b[1])) / 2 + 1, up = P[i].y <= P[j].y ? 1 : -1;
        P[i].y = clampY(P[i].y - up * push); P[j].y = clampY(P[j].y + up * push); moved = true; } }
    if (!moved) break;
  }
  return {H, pos: Object.fromEntries(nodes.map((x, i) => [x.id, {...P[i], label: labelled.has(i)}]))};
}

function drawGraph(d) {
  const g = d.graph; if (!g || !g.nodes.length) { $("#graph").innerHTML = `<div class="empty">No graph yet.</div>`; return; }
  const W = 760;
  if (!layout.pos || Object.keys(layout.pos).length !== g.nodes.length) layout = layoutGraph(g, W);
  const {H, pos} = layout;
  const color = {person: "var(--accent)", organization: "var(--pos)", group: "#e8590c", place: "var(--mid)", concept: "#9c36b5", event: "var(--neg)"};
  $("#graph").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Knowledge graph">
    ${g.links.map(l => { const a = pos[l.source], b = pos[l.target]; return a && b ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--mid)" stroke-opacity=".45" stroke-width="1.5"><title>${esc(l.source)} ${esc(l.label)} ${esc(l.target)}</title></line>` : ""; }).join("")}
    ${g.nodes.map(n => { const p = pos[n.id]; return `<g><circle cx="${p.x}" cy="${p.y}" r="${5 + Math.min(8, n.degree * 1.5)}" fill="${color[n.kind] || "var(--mid)"}"><title>${esc(n.id)} (${n.kind})\n${esc(n.summary)}</title></circle>${p.label ? `<text x="${p.x + 9}" y="${p.y + 4}">${esc(n.id)}</text>` : ""}</g>`; }).join("")}
  </svg><div style="color:var(--muted);font-size:12px">${Object.entries(color).map(([k, c]) => `<span style="color:${c}">●</span> ${k}`).join(" &nbsp; ")} · ${g.nodes.length} entities, ${g.links.length} relations${g.nodes.length > 30 ? " · hover a node for its name" : ""}</div>`;
}

function drawAgents(d) {
  if (!d.agents.length) { $("#agents").innerHTML = `<div class="empty">No agents yet.</div>`; return; }
  const bar = s => { const l = 50 + Math.min(0, s) * 50, w = Math.abs(s) * 50;
    return `<div class="bar"><b></b><i style="left:${l}%;width:${w}%;background:${stanceColor(s)}"></i></div>`; };
  $("#agents").innerHTML = `<table><tr><th>Agent</th><th>Influence</th><th>Start → now</th><th style="width:30%">Stance</th><th></th></tr>
    ${[...d.agents].sort((a, b) => b.influence - a.influence).map(a => `<tr><td><strong>${esc(a.name)}</strong> <span class="badge">${a.kind}</span>
      <div style="color:var(--muted);font-size:12px">${esc(a.bio)}</div></td><td>${a.influence.toFixed(2)}</td>
      <td>${a.start_stance.toFixed(2)} → <span style="color:${stanceColor(a.stance)}">${a.stance.toFixed(2)}</span></td><td>${bar(a.stance)}</td>
      <td><button class="ghost" data-chat="${a.id}">Chat</button></td></tr>`).join("")}</table>`;
  $("#agents").querySelectorAll("[data-chat]").forEach(b => b.onclick = () => {
    $("#who").value = b.dataset.chat; drawChat(); $('#tabs [data-t="chat"]').click(); });
}

function drawFeed(d) {
  if (!d.posts.length) { $("#feed").innerHTML = `<div class="empty">Run some rounds to see the feed.</div>`; return; }
  $("#feed").innerHTML = [...d.posts].reverse().map(p => p.kind === "event"
    ? `<div class="post event"><strong>⚡ World event · round ${p.round}</strong><br>${esc(p.content)}</div>`
    : `<div class="post ${p.kind}"><div class="meta"><strong style="color:var(--ink)">${esc(p.author_name)}</strong> · round ${p.round} · ${p.id}${p.parent_id ? ` · reply to ${p.parent_id}` : ""}</div>
       <div>${esc(p.content)}</div><div class="meta">♥ ${p.likes.length} · ⟳ ${p.reposts.length} · stance <span style="color:${stanceColor(p.stance)}">${p.stance.toFixed(2)}</span></div></div>`).join("");
}

function md(src) {
  // Minimal markdown: headings, bold, lists, tables.
  const lines = src.split("\n"), out = []; let i = 0;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++; }
    else if (l.startsWith("- ")) { const items = []; while (i < lines.length && lines[i].startsWith("- ")) items.push(`<li>${inline(lines[i++].slice(2))}</li>`); out.push(`<ul>${items.join("")}</ul>`); }
    else if (l.startsWith("|")) { const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.split("|").slice(1, -1).map(c => c.trim());
      out.push(`<table><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`); }
    else { if (l.trim()) out.push(`<p>${inline(l)}</p>`); i++; }
  }
  return out.join("");
}

function drawReport(d) {
  $("#report").innerHTML = d.report ? md(d.report.markdown) + `<p><a href="/api/projects/${d.id}/report.md" download="report.md">Download markdown</a></p>`
    : `<div class="empty">The report is written after a run finishes.</div>`;
}

function fillWho(d) {
  const sel = $("#who"), prev = sel.value;
  const opts = [`<option value="">Report analyst</option>`, ...d.agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`)];
  if (sel.options.length !== opts.length) { sel.innerHTML = opts.join(""); sel.value = prev; drawChat(); }
}

function drawChat() {
  const log = chats[$("#who").value] || [];
  $("#chatlog").innerHTML = log.map(m => `<div class="msg ${m.role}">${esc(m.content)}</div>`).join("") || `<div class="empty">Ask the analyst about the report, or interview any agent.</div>`;
  $("#chatlog").scrollTop = 1e9;
}

async function send() {
  const text = $("#chatIn").value.trim(), who = $("#who").value; if (!text) return;
  const log = chats[who] = chats[who] || [];
  log.push({role: "user", content: text}); $("#chatIn").value = ""; drawChat();
  try {
    const r = await api(`/api/projects/${current}/chat`, {method: "POST", body: JSON.stringify({agent_id: who || null, messages: log})});
    log.push({role: "assistant", content: r.reply});
  } catch (e) { log.pop(); $("#chatIn").value = text; $("#actErr").textContent = e.message; }
  drawChat();
}

api("/api/health").then(h => $("#llm").textContent = `LLM: ${h.llm}`);
refreshList();
if (location.hash.length > 1) {
  const [id, tab] = location.hash.slice(1).split("/");
  open(id).then(() => tab && $(`#tabs [data-t="${CSS.escape(tab)}"]`)?.click()).catch(() => history.replaceState(null, "", "/"));
}
</script>
