[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmsight"
version = "0.1.0"
description = "Rehearse the future: turn seed documents into a swarm of LLM agents, simulate them, and get a prediction report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
swarmsight = "swarmsight.cli:main"

[tool.setuptools.packages.find]
include = ["swarmsight*"]

[tool.setuptools.package-data]
swarmsight = ["web/*.html"]
